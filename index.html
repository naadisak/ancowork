<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VPNcheck Co-worker</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bai+Jamjuree:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Bai Jamjuree', sans-serif;
      background-color: #f4f7f6;
      color: #333333;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 40px 20px;
    }
    .container {
      width: 100%;
      max-width: 1320px;
      background: #ffffff;
      padding: 40px;
      border-radius: 16px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.06);
    }
    .header-title {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      font-size: 2rem;
      font-weight: 700;
      text-align: center;
      margin-bottom: 30px;
      color: #1a1a1a;
      letter-spacing: 1px;
    }
    .header-title .shield-icon {
      width: 34px;
      height: 34px;
      flex-shrink: 0;
      animation: shieldPulse 2.4s ease-in-out infinite;
    }
    @keyframes shieldPulse {
      0%, 100% { transform: scale(1); filter: drop-shadow(0 0 0px rgba(0,123,255,0.4)); }
      50% { transform: scale(1.08); filter: drop-shadow(0 0 6px rgba(0,123,255,0.55)); }
    }

    /* โซนค้นหา */
    .search-container {
      display: flex;
      gap: 15px;
      justify-content: center;
      margin-bottom: 40px;
      flex-wrap: wrap;
    }
    .input-wrapper {
      flex: 1;
      max-width: 500px;
      min-width: 250px;
    }
    input[type="text"] {
      width: 100%;
      padding: 15px 20px;
      background: #fafafa;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      color: #333;
      font-family: 'Bai Jamjuree', sans-serif;
      font-size: 1.1rem;
      transition: all 0.3s;
    }
    input[type="text"]:focus {
      outline: none;
      border-color: #007BFF;
      background: #ffffff;
      box-shadow: 0 0 0 4px rgba(0, 123, 255, 0.1);
    }

    /* ปุ่มสไตล์เรืองแสง (Light Mode) */
    .btn-search {
      position: relative;
      width: 160px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: #ffffff;
      color: #1a1a1a;
      font-family: 'Bai Jamjuree', sans-serif;
      font-size: 1.1rem;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      overflow: hidden;
      z-index: 1;
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
    }
    .btn-search svg { width: 18px; height: 18px; }
    .btn-search::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: conic-gradient(transparent, transparent, transparent, #007BFF);
      animation: rotate 2s linear infinite;
      z-index: -2;
    }
    .btn-search::after {
      content: '';
      position: absolute;
      inset: 2px;
      background: #ffffff;
      border-radius: 6px;
      z-index: -1;
      transition: background 0.3s;
    }
    .btn-search:hover::after {
      background: #f8f9fa;
    }
    @keyframes rotate {
      100% { transform: rotate(360deg); }
    }

    .status-text {
      text-align: center;
      font-size: 1.1rem;
      margin-bottom: 12px;
      font-weight: 500;
      display: none;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .status-text.visible { display: flex; }
    .status-icon {
      width: 26px;
      height: 26px;
      vertical-align: middle;
    }

    /* ปุ่ม Load more */
    .load-more-wrap {
      display: none;
      justify-content: center;
      margin-top: 30px;
    }
    .load-more-wrap.show { display: flex; }
    .btn-load-more {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: #ffffff;
      color: #1a1a1a;
      border: 2px solid #e0e0e0;
      padding: 12px 26px;
      border-radius: 50px;
      font-family: 'Bai Jamjuree', sans-serif;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: border-color 0.2s, transform 0.15s, box-shadow 0.2s;
    }
    .btn-load-more:hover {
      border-color: #007BFF;
      transform: translateY(-1px);
      box-shadow: 0 6px 18px rgba(0,123,255,0.12);
    }
    .btn-load-more img {
      width: 22px;
      height: 22px;
    }

    .footer-credit {
      text-align: center;
      font-size: 0.75rem;
      color: #aaaaaa;
      margin-top: 36px;
    }
    .footer-credit a {
      color: #999999;
    }

    /* Progress bar แบบ preloading */
    .progress-wrap {
      display: none;
      width: 100%;
      max-width: 500px;
      margin: 0 auto 24px auto;
    }
    .progress-track {
      width: 100%;
      height: 8px;
      background: #e9ecef;
      border-radius: 10px;
      overflow: hidden;
      position: relative;
    }
    .progress-fill {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      width: 35%;
      border-radius: 10px;
      background: linear-gradient(90deg, #007BFF, #66c2ff);
      animation: progressSlide 1.1s ease-in-out infinite;
    }
    @keyframes progressSlide {
      0%   { left: -35%; }
      100% { left: 100%; }
    }

    /* การ์ดแสดงผล (Light Mode) - 2 คอลัมภ์บน PC */
    .card-list {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
      align-items: start;
    }
    .flex-card {
      position: relative;
      background: #ffffff;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 4px 15px rgba(0,0,0,0.04);
      border: 1px solid #eeeeee;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .flex-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(0,0,0,0.08);
    }

    /* การ์ดของรายการที่หมดอายุการใช้งานแล้ว */
    .flex-card.expired {
      background: rgba(220, 53, 69, 0.08);
      border-color: rgba(220, 53, 69, 0.35);
    }
    .flex-card.expired::after {
      content: 'หมดอายุการใช้งานแล้ว';
      position: absolute;
      top: 24px;
      left: -72px;
      width: 290px;
      padding: 6px 0;
      background: linear-gradient(135deg, #ff5c5c, #dc3545);
      color: #ffffff;
      font-size: 0.82rem;
      font-weight: 700;
      letter-spacing: 1px;
      text-align: center;
      transform: rotate(-45deg);
      transform-origin: center;
      box-shadow: 0 3px 10px rgba(0,0,0,0.2);
      z-index: 6;
      pointer-events: none;
    }
    .card-top-line {
      height: 4px;
      width: 100%;
    }
    .flex-card-inner {
      padding: 25px;
      display: flex;
      flex-direction: column;
      height: 100%;
    }
    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 20px;
      padding-bottom: 15px;
      border-bottom: 1px solid #f0f0f0;
      flex-wrap: wrap;
      gap: 10px;
    }
    .id-name-group {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    /* สไตล์สำหรับข้อความที่คัดลอกได้ */
    .copyable {
      cursor: pointer;
      display: inline-block;
      padding: 2px 6px;
      margin: -2px -6px;
      border-radius: 4px;
      transition: background-color 0.2s, outline 0.2s;
    }
    .copyable:hover {
      background-color: #f0f4f8;
      outline: 1px dashed #cce0ff;
    }
    .copyable:active {
      background-color: #e2e8f0;
    }
    .copyable::after {
      content: ' 📋';
      font-size: 0.8rem;
      opacity: 0;
      transition: opacity 0.2s;
    }
    .copyable:hover::after {
      opacity: 1;
    }

    .emp-id {
      font-size: 1.4rem;
      font-weight: 700;
      color: #111;
    }
    .emp-name {
      font-size: 1.05rem;
      font-weight: 600;
      color: #333;
    }
    .emp-dept {
      font-size: 0.9rem;
      font-weight: 500;
      color: #777;
      padding: 4px 10px;
      background: #f4f6f8;
      border-radius: 6px;
    }
    .source-tag {
      font-size: 0.8rem;
      padding: 4px 10px;
      border-radius: 6px;
      font-weight: 600;
      letter-spacing: 0.5px;
      white-space: nowrap;
    }

    .data-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
    }
    .data-item {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
    }
    .data-label {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.8rem;
      color: #888888;
      margin-bottom: 6px;
      font-weight: 600;
    }
    .data-label svg {
      width: 15px;
      height: 15px;
      flex-shrink: 0;
      stroke: #007BFF;
    }
    .data-value {
      font-size: 1.05rem;
      color: #222222;
      font-weight: 600;
      word-break: break-word;
    }
    .sub-value {
      font-size: 0.85rem;
      color: #666666;
      margin-top: 4px;
    }

    /* Badge เบอร์โทร แบบเรืองแสงสีแดง */
    .phone-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 12px 5px 8px;
      border-radius: 50px;
      background: linear-gradient(135deg, #ff5c5c, #dc3545);
      color: #fff;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 0 10px rgba(220,53,69,0.5), 0 0 20px rgba(220,53,69,0.25);
      animation: badgeGlow 2.2s ease-in-out infinite;
      transition: transform 0.15s;
    }
    .phone-badge:hover {
      transform: translateY(-1px) scale(1.03);
    }
    .phone-badge svg {
      width: 13px;
      height: 13px;
      animation: ringShake 1.8s ease-in-out infinite;
    }
    @keyframes badgeGlow {
      0%, 100% { box-shadow: 0 0 10px rgba(220,53,69,0.5), 0 0 20px rgba(220,53,69,0.25); }
      50% { box-shadow: 0 0 16px rgba(220,53,69,0.85), 0 0 32px rgba(220,53,69,0.5); }
    }
    @keyframes ringShake {
      0%, 80%, 100% { transform: rotate(0deg); }
      82% { transform: rotate(-15deg); }
      86% { transform: rotate(12deg); }
      90% { transform: rotate(-8deg); }
      94% { transform: rotate(4deg); }
    }

    /* ปุ่มคัดลอกข้อมูลทั้งหมดของแต่ละรายการ */
    .card-footer {
      display: flex;
      justify-content: flex-end;
      margin-top: 20px;
      padding-top: 15px;
      border-top: 1px dashed #eeeeee;
    }
    .copy-card-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #f4f6f8;
      color: #1a1a1a;
      border: 1px solid #e2e6ea;
      padding: 8px 16px;
      border-radius: 50px;
      font-family: 'Bai Jamjuree', sans-serif;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, transform 0.15s;
    }
    .copy-card-btn:hover {
      background: #e9edf1;
      transform: translateY(-1px);
    }
    .copy-card-btn svg {
      width: 15px;
      height: 15px;
      stroke: #007BFF;
    }

    /* กล่องแจ้งเตือน (Toast) แบบ Badge เรืองแสงสีแดง */
    #toast {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 8px;
      background: linear-gradient(135deg, #ff5c5c, #dc3545);
      color: #fff;
      padding: 12px 24px;
      border-radius: 50px;
      font-size: 1rem;
      font-weight: 600;
      box-shadow: 0 0 12px rgba(220,53,69,0.55), 0 0 28px rgba(220,53,69,0.35);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease, transform 0.3s ease;
      z-index: 1000;
      max-width: 90vw;
      text-align: center;
    }
    #toast svg { width: 16px; height: 16px; flex-shrink: 0; }
    #toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(-10px);
      animation: badgeGlow 2.2s ease-in-out infinite;
    }

    /* Responsive */
    @media (max-width: 980px) {
      .card-list { grid-template-columns: 1fr; }
    }
    @media (max-width: 600px) {
      .data-grid { grid-template-columns: 1fr; gap: 15px; }
      .search-container { flex-direction: column; }
      .btn-search { width: 100%; padding: 15px; }
      .flex-card-inner { padding: 20px; }
      .card-footer { justify-content: stretch; }
      .copy-card-btn { width: 100%; justify-content: center; }
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header-title">
      <svg class="shield-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 2L4 5V11C4 16.55 7.84 21.74 12 23C16.16 21.74 20 16.55 20 11V5L12 2Z" fill="#E6F2FF" stroke="#007BFF" stroke-width="1.5" stroke-linejoin="round"/>
        <path d="M9 12L11 14L15.5 9.5" stroke="#007BFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span>VPNcheck Co-worker</span>
    </div>

    <div class="search-container">
      <div class="input-wrapper">
        <input type="text" id="searchKey" placeholder="ระบุรหัสพนักงาน หรือ ชื่อ แล้วกด Enter..." onkeypress="if(event.key === 'Enter') searchData()">
      </div>
      <button class="btn-search" onclick="searchData()">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="11" cy="11" r="7" stroke="#007BFF" stroke-width="2"/>
          <path d="M20 20L16.5 16.5" stroke="#007BFF" stroke-width="2" stroke-linecap="round"/>
        </svg>
        <span>ค้นหาข้อมูล</span>
      </button>
    </div>

    <div id="statusBox" class="status-text" style="display: none;"></div>
    <div id="progressWrap" class="progress-wrap">
      <div class="progress-track"><div class="progress-fill"></div></div>
    </div>
    <div id="resultBox" class="card-list"></div>
    <div id="loadMoreWrap" class="load-more-wrap"></div>

    <div class="footer-credit">
      Icons by <a href="https://www.flaticon.com/free-animated-icon/absence_12340772" target="_blank" rel="noopener">Freepik - Flaticon</a>
      &amp; <a href="https://www.flaticon.com/free-animated-icon/loading_17905699" target="_blank" rel="noopener">Freepik - Flaticon</a>
    </div>
  </div>

  <div id="toast">
    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <rect x="4" y="4" width="16" height="16" rx="3" stroke="#fff" stroke-width="1.8"/>
      <path d="M8 8H16M8 12H16M8 16H12" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/>
    </svg>
    <span id="toastText">คัดลอกข้อมูลแล้วข้าน้อย!</span>
  </div>

  <script>
    // ⚠️ อย่าลืมแก้ URL ให้เป็นของ Web App ฝั่ง Google Apps Script ของอ้ายหำเน้อ
    const scriptUrl = 'https://script.google.com/macros/s/AKfycbxMqht7LawyLd6pesWRdGFnMwP6eYXfSeklj2wtDkFTqLZxzzdkxg-iNomzR3LXonEKUg/exec';

    const themes = [
      { accent: "#007BFF", bg: "#E6F2FF" },
      { accent: "#28A745", bg: "#E9F7EF" },
      { accent: "#6F42C1", bg: "#F3E8FF" },
      { accent: "#FD7E14", bg: "#FFF2E5" },
      { accent: "#E83E8C", bg: "#FDE8F3" }
    ];

    // เก็บผลลัพธ์การค้นหาล่าสุดไว้ใช้กับปุ่ม "คัดลอกข้อมูลทั้งหมด" ของแต่ละรายการ
    let currentResults = [];

    // การแบ่งหน้า: แสดงทีละ 10 รายการ กด Load more เพื่อดูเพิ่ม
    const PAGE_SIZE = 10;
    let displayCount = PAGE_SIZE;

    // ไอคอนแบบ Animated จาก Flaticon (แหล่งเดียวกันทั้งชุด: Freepik / Flaticon Animated Icons)
    // Absence icon: https://www.flaticon.com/free-animated-icon/absence_12340772
    const ICON_RESULT_COUNT = 'https://cdn-icons-gif.flaticon.com/12340/12340772.gif';
    // Loading icon: https://www.flaticon.com/free-animated-icon/loading_17905699
    const ICON_LOAD_MORE = 'https://cdn-icons-gif.flaticon.com/17905/17905699.gif';

    // ชุดไอคอนเส้น (line icon) มาจากแหล่งเดียวกัน สไตล์เดียวกันทั้งหมด: stroke-width 1.8, rounded cap/join
    const icons = {
      phone: `<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M6.6 10.8C7.9 13.4 10 15.5 12.6 16.8L14.6 14.8C14.9 14.5 15.3 14.4 15.6 14.6C16.7 15 17.9 15.2 19.1 15.2C19.6 15.2 20 15.6 20 16.1V19.4C20 19.9 19.6 20.3 19.1 20.3C10.2 20.3 3 13.1 3 4.2C3 3.7 3.4 3.3 3.9 3.3H7.2C7.7 3.3 8.1 3.7 8.1 4.2C8.1 5.4 8.3 6.6 8.7 7.7C8.8 8 8.7 8.4 8.5 8.7L6.6 10.8Z" fill="#fff"/>
      </svg>`,
      user: `<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="12" cy="8" r="3.4" stroke-width="1.8"/>
        <path d="M5 20C5.8 16.4 8.5 14.5 12 14.5C15.5 14.5 18.2 16.4 19 20" stroke-width="1.8" stroke-linecap="round"/>
      </svg>`,
      key: `<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="8" cy="15" r="3.4" stroke-width="1.8"/>
        <path d="M10.4 12.6L18.5 4.5" stroke-width="1.8" stroke-linecap="round"/>
        <path d="M15.5 7.5L18 10" stroke-width="1.8" stroke-linecap="round"/>
        <path d="M18 4.5L20.5 7" stroke-width="1.8" stroke-linecap="round"/>
      </svg>`,
      headset: `<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M4 13V12C4 7.6 7.6 4 12 4C16.4 4 20 7.6 20 12V13" stroke-width="1.8" stroke-linecap="round"/>
        <rect x="3" y="13" width="4" height="6" rx="1.5" stroke-width="1.8"/>
        <rect x="17" y="13" width="4" height="6" rx="1.5" stroke-width="1.8"/>
        <path d="M19 19V20C19 21.1 18.1 22 17 22H13.5" stroke-width="1.8" stroke-linecap="round"/>
      </svg>`,
      copy: `<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="7" y="7" width="12" height="14" rx="2" stroke-width="1.8"/>
        <path d="M5 17V5C5 3.89543 5.89543 3 7 3H15" stroke-width="1.8" stroke-linecap="round"/>
      </svg>`
    };
    // ทำให้ทุกไอคอนใช้ stroke สีเดียวกับที่กำหนดใน CSS (currentColor)
    Object.keys(icons).forEach(k => {
      icons[k] = icons[k].replace(/<svg /, '<svg stroke="currentColor" ');
    });

    // ฟังก์ชันสำหรับคัดลอกข้อมูลและแสดง Popup แจ้งเตือน
    function copyText(text) {
      navigator.clipboard.writeText(text).then(() => {
        showToast(`คัดลอก "${text}" แล้วข้าน้อย!`);
      }).catch(err => {
        console.error('Copy failed', err);
        alert('❌ เบราว์เซอร์ไม่รองรับการคัดลอกอัตโนมัติ');
      });
    }

    // คัดลอกข้อมูลทั้งหมดของ "รายการเดียว" (การ์ดเดียว) ไม่ใช่ทั้งหน้า
    function copyCardData(index) {
      const info = currentResults[index];
      if (!info) return;

      const text = [
        `รหัสพนักงาน: ${info.id}`,
        `ชื่อ-นามสกุล: ${info.name} ${info.surname}`,
        `แผนก/ส่วนงาน: ${info.dept}`,
        `เบอร์โทรติดต่อ: ${info.phone}`,
        `User: ${info.user}`,
        `รหัสผ่าน: ${info.pass} (${info.expire})`,
        `X-Lite: ${info.xlite} (Svr: ${info.server})`
      ].join('\n');

      navigator.clipboard.writeText(text).then(() => {
        showToast(`คัดลอกข้อมูลของ ${info.name} ${info.surname} แล้วข้าน้อย!`);
      }).catch(err => {
        console.error('Copy card failed', err);
        alert('❌ เบราว์เซอร์ไม่รองรับการคัดลอกอัตโนมัติ');
      });
    }

    function showToast(message) {
      const toast = document.getElementById('toast');
      document.getElementById('toastText').innerText = message;
      toast.classList.add('show');
      clearTimeout(window.__toastTimer);
      window.__toastTimer = setTimeout(() => {
        toast.classList.remove('show');
      }, 2500);
    }

    // แปลงข้อความวันที่หมดอายุ (รองรับหลายรูปแบบ: yyyy-mm-dd, dd/mm/yyyy, dd-mm-yyyy, ปี พ.ศ.) เป็น Date
    function parseExpireDate(str) {
      if (!str) return null;
      const s = String(str).trim();

      // yyyy-mm-dd หรือ yyyy/mm/dd
      let m = s.match(/^(\d{4})[-\/](\d{1,2})[-\/](\d{1,2})/);
      if (m) return new Date(+m[1], +m[2] - 1, +m[3]);

      // dd-mm-yyyy หรือ dd/mm/yyyy (รองรับปี พ.ศ. ด้วย)
      m = s.match(/^(\d{1,2})[-\/](\d{1,2})[-\/](\d{4})/);
      if (m) {
        let year = +m[3];
        if (year > 2400) year -= 543; // พ.ศ. -> ค.ศ.
        return new Date(year, +m[2] - 1, +m[1]);
      }

      // เผื่อรูปแบบอื่น ให้ JS ลองแปลงเอง
      const fallback = new Date(s);
      return isNaN(fallback.getTime()) ? null : fallback;
    }

    // ตรวจสอบว่ารายการนี้หมดอายุการใช้งานแล้วหรือยัง
    function isExpired(expireStr) {
      const d = parseExpireDate(expireStr);
      if (!d) return false;
      const today = new Date();
      today.setHours(0, 0, 0, 0);
      d.setHours(0, 0, 0, 0);
      return d.getTime() < today.getTime();
    }

    // สร้าง HTML ของการ์ดหนึ่งใบ
    function buildCardHtml(info, index) {
      const theme = themes[index % themes.length];
      const expired = isExpired(info.expire);
      return `
        <div class="flex-card${expired ? ' expired' : ''}">
          <div class="card-top-line" style="background-color: ${theme.accent};"></div>
          <div class="flex-card-inner">
            <div class="card-header">
              <div class="id-name-group">
                <span class="emp-id copyable" onclick="copyText('${info.id}')" title="คลิกเพื่อคัดลอกรหัส">${info.id}</span>
                <span class="emp-name copyable" onclick="copyText('${info.name} ${info.surname}')" title="คลิกเพื่อคัดลอกชื่อ">${info.name} ${info.surname}</span>
                <span class="emp-dept copyable" onclick="copyText('${info.dept}')" title="คลิกเพื่อคัดลอกแผนก">${info.dept}</span>
                <span class="phone-badge" onclick="copyText('${info.phone}')" title="คลิกเพื่อคัดลอกเบอร์โทร">
                  ${icons.phone}
                  <span>${info.phone}</span>
                </span>
              </div>
              <div class="source-tag" style="background-color: ${theme.bg}; color: ${theme.accent};">${info.source}</div>
            </div>

            <div class="data-grid">
              <div class="data-item">
                <div class="data-label">${icons.user}<span>บัญชี (User)</span></div>
                <div class="data-value copyable" onclick="copyText('${info.user}')" title="คลิกเพื่อคัดลอก User" style="color: ${theme.accent};">${info.user}</div>
              </div>
              <div class="data-item">
                <div class="data-label">${icons.key}<span>รหัสผ่าน / หมดอายุ</span></div>
                <div class="data-value copyable" onclick="copyText('${info.pass}')" title="คลิกเพื่อคัดลอกรหัสผ่าน">${info.pass}</div>
                <div class="sub-value" style="color: #DC3545;">⏳ ${info.expire}</div>
              </div>
              <div class="data-item">
                <div class="data-label">${icons.headset}<span>ระบบ VoIP</span></div>
                <div class="data-value copyable" onclick="copyText('${info.xlite}')" title="คลิกเพื่อคัดลอก X-Lite">${info.xlite}</div>
                <div class="sub-value copyable" onclick="copyText('${info.server}')" title="คลิกเพื่อคัดลอก Server">Svr: ${info.server}</div>
              </div>
            </div>

            <div class="card-footer">
              <button class="copy-card-btn" onclick="copyCardData(${index})">
                ${icons.copy}
                <span>คัดลอกข้อมูลทั้งหมด</span>
              </button>
            </div>
          </div>
        </div>
      `;
    }

    // แสดงการ์ดตามจำนวนหน้าปัจจุบัน (displayCount) พร้อมปุ่ม Load more ถ้ายังมีรายการเหลือ
    function renderCards() {
      const resultBox = document.getElementById('resultBox');
      const loadMoreWrap = document.getElementById('loadMoreWrap');

      const visibleItems = currentResults.slice(0, displayCount);
      resultBox.innerHTML = visibleItems.map((info, i) => buildCardHtml(info, i)).join('');

      if (displayCount < currentResults.length) {
        const remaining = currentResults.length - displayCount;
        loadMoreWrap.innerHTML = `
          <button class="btn-load-more" onclick="loadMore()">
            <img src="${ICON_LOAD_MORE}" alt="กำลังโหลด">
            <span>โหลดเพิ่มเติม (เหลืออีก ${remaining} รายการ)</span>
          </button>
        `;
        loadMoreWrap.classList.add('show');
      } else {
        loadMoreWrap.innerHTML = "";
        loadMoreWrap.classList.remove('show');
      }
    }

    // กด Load more เพื่อแสดงข้อมูลอีก 10 รายการถัดไป
    function loadMore() {
      displayCount += PAGE_SIZE;
      renderCards();
    }

    async function searchData() {
      const keyword = document.getElementById('searchKey').value.trim();
      const statusBox = document.getElementById('statusBox');
      const progressWrap = document.getElementById('progressWrap');
      const resultBox = document.getElementById('resultBox');
      const loadMoreWrap = document.getElementById('loadMoreWrap');

      currentResults = [];
      displayCount = PAGE_SIZE;

      if (!keyword) {
        statusBox.style.display = "flex";
        statusBox.style.color = "#DC3545";
        statusBox.innerText = "⚠️ กรุณากรอกรหัสหรือชื่อก่อนข้าน้อย";
        progressWrap.style.display = "none";
        resultBox.innerHTML = "";
        loadMoreWrap.classList.remove('show');
        return;
      }

      statusBox.style.display = "flex";
      statusBox.style.color = "#6c757d";
      statusBox.innerText = "กำลังตรวจสอบฐานข้อมูล...";
      progressWrap.style.display = "block";
      resultBox.innerHTML = "";
      loadMoreWrap.classList.remove('show');

      try {
        const targetUrl = `${scriptUrl}?action=search&keyword=${encodeURIComponent(keyword)}`;
        const response = await fetch(targetUrl);
        const result = await response.json();

        progressWrap.style.display = "none";

        if (result.results && result.results.length > 0) {
          const totalItems = result.results.length;
          currentResults = result.results;
          statusBox.style.color = "#28A745";
          statusBox.innerHTML = `<img class="status-icon" src="${ICON_RESULT_COUNT}" alt="พบข้อมูล"> พบข้อมูลทั้งหมด ${totalItems} รายการ`;

          renderCards();
        } else {
          statusBox.style.color = "#DC3545";
          statusBox.innerText = `❌ ไม่พบข้อมูลของ "${keyword}" ข้าน้อย`;
        }
      } catch (err) {
        progressWrap.style.display = "none";
        statusBox.style.color = "#DC3545";
        statusBox.innerText = "❌ เกิดปัญหาการเชื่อมต่อ: " + err.toString();
      }
    }
  </script>
</body>
</html>
