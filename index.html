<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VPNcheck — ops console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#080b0a;
    --panel:#0d1211;
    --panel-2:#111815;
    --line:#1d2823;
    --line-2:#2a3833;
    --text:#e2ebe6;
    --text-2:#b9c8c1;
    --muted:#77897f;
    --accent:#5ce6a1;
    --accent-dim:rgba(92,230,161,.12);
    --warn:#e9b552;
    --danger:#ff8080;
    --mono:'JetBrains Mono',ui-monospace,monospace;
    --sans:'IBM Plex Sans Thai',system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--text);font-family:var(--sans);line-height:1.5;font-size:14px}
  button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
  ::selection{background:var(--accent);color:#04120b}

  .shell{display:grid;grid-template-rows:auto minmax(0,1fr);height:100dvh}

  /* ---------- top bar ---------- */
  .bar{
    display:flex;align-items:center;justify-content:space-between;gap:16px;
    padding:0 18px;height:46px;
    border-bottom:1px solid var(--line);background:var(--panel);
    font:11.5px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);
  }
  .bar-l{display:flex;align-items:center;gap:10px;min-width:0}
  .bar-l b{color:var(--text);font-weight:600;letter-spacing:.12em}
  .bar-l .slash{color:var(--line-2)}
  .bar-r{display:flex;align-items:center;gap:14px;white-space:nowrap}
  .link{display:inline-flex;align-items:center;gap:6px;color:var(--accent)}
  .link i{width:6px;height:6px;background:currentColor;display:block;box-shadow:0 0 0 3px var(--accent-dim)}
  #clock{color:var(--text-2)}

  /* ---------- workspace ---------- */
  .workspace{display:grid;grid-template-columns:minmax(320px,384px) minmax(0,1fr);min-height:0}

  /* left pane */
  .pane-list{display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--line);background:var(--panel)}
  .search-wrap{padding:14px 14px 12px;border-bottom:1px solid var(--line)}
  .search{display:flex;align-items:center;gap:8px;border:1px solid var(--line-2);background:var(--bg);padding:0 10px}
  .search:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-dim)}
  .search svg{width:14px;height:14px;color:var(--muted);flex:0 0 auto}
  .search input{
    flex:1 1 auto;min-width:0;background:transparent;border:0;outline:0;
    color:var(--text);font:13px var(--mono);padding:10px 0;letter-spacing:.01em;
  }
  .search input::placeholder{color:#5d6e66}
  .search input::-webkit-search-cancel-button{display:none}
  .search button{
    flex:0 0 auto;font:10.5px var(--mono);letter-spacing:.1em;text-transform:uppercase;
    color:var(--accent);padding:5px 6px;border-left:1px solid var(--line);
  }
  .search button:hover{color:#fff}
  .list-meta{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:10px 14px;border-bottom:1px solid var(--line);
    font:10.5px/1.4 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);
  }
  #statusBox{color:var(--text-2)}
  #statusBox[data-tone="ok"]{color:var(--accent)}
  #statusBox[data-tone="warn"]{color:var(--warn)}
  #statusBox[data-tone="error"]{color:var(--danger)}

  .rows{flex:1 1 auto;overflow:auto;min-height:0}
  .row{
    display:flex;align-items:center;gap:10px;width:100%;text-align:left;
    padding:10px 14px;border-bottom:1px solid var(--line);
    transition:background .1s;
  }
  .row:hover{background:var(--panel-2)}
  .row[aria-current="true"]{background:var(--panel-2);box-shadow:inset 2px 0 0 var(--accent)}
  .led{width:6px;height:6px;flex:0 0 6px;background:var(--accent)}
  .row[data-tone="warn"] .led{background:var(--warn)}
  .row[data-tone="expired"] .led{background:var(--danger)}
  .row[data-tone="unknown"] .led{background:var(--line-2)}
  .row-main{flex:1 1 auto;min-width:0}
  .row-main b{display:block;font-weight:500;font-size:13.5px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row-main em{display:block;font:11px var(--mono);color:var(--muted);font-style:normal;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
  .row-days{flex:0 0 auto;font:11px var(--mono);color:var(--muted)}
  .row[data-tone="expired"] .row-days{color:var(--danger)}
  .row[data-tone="warn"] .row-days{color:var(--warn)}

  .list-foot{padding:10px 14px;border-top:1px solid var(--line)}
  .btn-line{
    width:100%;font:11px var(--mono);letter-spacing:.08em;text-transform:uppercase;
    color:var(--text-2);border:1px solid var(--line-2);padding:9px;display:none;
  }
  .list-foot.show .btn-line{display:block}
  .btn-line:hover{border-color:var(--accent);color:var(--accent)}

  /* right pane */
  .pane-detail{min-height:0;overflow:auto;padding:26px 30px 40px;background:var(--bg)}
  .empty{
    height:100%;display:flex;flex-direction:column;justify-content:center;gap:8px;
    border:1px dashed var(--line-2);padding:40px;color:var(--muted);max-width:520px;
  }
  .empty b{color:var(--text-2);font-weight:500;font-size:15px}
  .empty span{font:12px var(--mono);letter-spacing:.04em}

  .d-head{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;flex-wrap:wrap;padding-bottom:18px;border-bottom:1px solid var(--line)}
  .d-head h1{margin:0;font-size:26px;font-weight:600;letter-spacing:-.01em;line-height:1.25}
  .d-head .meta{margin:6px 0 0;font:12px var(--mono);color:var(--muted);letter-spacing:.03em}
  .d-state{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
  .chip{
    font:10.5px var(--mono);letter-spacing:.1em;text-transform:uppercase;
    padding:4px 8px;border:1px solid currentColor;
  }
  .chip[data-tone="ok"]{color:var(--accent)}
  .chip[data-tone="warn"]{color:var(--warn)}
  .chip[data-tone="expired"]{color:var(--danger)}
  .chip[data-tone="unknown"]{color:var(--muted)}
  .d-state small{font:11px var(--mono);color:var(--muted)}

  .blk{margin-top:22px}
  .blk h2{
    margin:0 0 10px;font:10.5px var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--muted);
    display:flex;align-items:center;gap:10px;
  }
  .blk h2::after{content:"";flex:1 1 auto;height:1px;background:var(--line)}

  .kv{display:grid;grid-template-columns:96px minmax(0,1fr) auto;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid rgba(29,40,35,.7)}
  .kv:last-child{border-bottom:0}
  .kv .k{font:10.5px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
  .kv .v{font:15px var(--mono);color:var(--text);overflow-wrap:anywhere;text-align:left;background:none}
  .kv .v.hide{letter-spacing:.18em;color:var(--text-2)}
  .kv .v.small{font-size:13px;color:var(--text-2)}
  .iconbtn{color:var(--muted);width:24px;height:24px;display:grid;place-items:center;border:1px solid transparent}
  .iconbtn:hover{color:var(--text);border-color:var(--line-2)}
  .iconbtn svg{width:13px;height:13px}

  .expiry{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
  .expiry .big{font:600 22px var(--mono);letter-spacing:-.01em}
  .expiry .big[data-tone="expired"]{color:var(--danger)}
  .expiry .big[data-tone="warn"]{color:var(--warn)}
  .bar-track{margin-top:12px;height:3px;background:var(--line);width:min(420px,100%)}
  .bar-fill{height:100%;background:var(--accent)}
  .bar-fill[data-tone="warn"]{background:var(--warn)}
  .bar-fill[data-tone="expired"]{background:var(--danger)}
  .bar-note{margin:8px 0 0;font:11.5px var(--mono);color:var(--muted)}

  .actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:26px}
  .btn-solid{
    font:11.5px var(--mono);letter-spacing:.08em;text-transform:uppercase;
    background:var(--accent);color:#04120b;padding:10px 16px;font-weight:600;
  }
  .btn-solid:hover{filter:brightness(1.08)}
  .btn-ghost{
    font:11.5px var(--mono);letter-spacing:.08em;text-transform:uppercase;
    border:1px solid var(--line-2);color:var(--text-2);padding:10px 16px;
  }
  .btn-ghost:hover{border-color:var(--accent);color:var(--accent)}

  /* template switcher */
  .tpl{display:inline-flex;align-items:center;border:1px solid var(--line-2);font:10.5px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase}
  .tpl a{padding:6px 9px;color:var(--muted);text-decoration:none;border-right:1px solid var(--line)}
  .tpl a:last-child{border-right:0}
  .tpl a:hover{color:var(--text)}
  .tpl a.on{color:#04120b;background:var(--accent);font-weight:600}

  /* avatars */
  .av{position:relative;width:26px;height:26px;flex:0 0 26px;border-radius:8px;overflow:hidden;background:var(--line);display:block}
  .av svg{width:100%;height:100%;display:block}
  .av .led{position:absolute;right:0;bottom:0;width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 2px var(--panel)}
  .av-lg{width:52px;height:52px;flex:0 0 52px;border-radius:14px}
  .d-who{display:flex;align-items:center;gap:14px;min-width:0}
  .d-who > div{min-width:0}

  /* toast */
  #toast{
    position:fixed;right:18px;bottom:18px;z-index:40;
    background:var(--panel-2);border:1px solid var(--line-2);border-left:3px solid var(--accent);
    color:var(--text);font:12px var(--mono);padding:10px 14px;max-width:min(480px,calc(100vw - 36px));
    opacity:0;transform:translateY(6px);transition:opacity .16s,transform .16s;pointer-events:none;
  }
  #toast.show{opacity:1;transform:translateY(0)}

  .sk-row{padding:10px 14px;border-bottom:1px solid var(--line)}
  .sk{height:9px;background:linear-gradient(90deg,#16201d 25%,#1e2a26 50%,#16201d 75%);background-size:220% 100%;animation:sh 1.2s infinite;margin-bottom:6px}
  @keyframes sh{to{background-position:-220% 0}}

  @media (max-width:860px){
    .tpl a{padding:5px 6px;font-size:9.5px;letter-spacing:.06em}
    .shell{height:auto;min-height:100dvh}
    .workspace{grid-template-columns:1fr}
    .pane-list{border-right:0;border-bottom:1px solid var(--line)}
    .rows{max-height:52vh}
    .pane-detail{padding:22px 18px 40px}
    .kv{grid-template-columns:78px minmax(0,1fr) auto}
    .d-head h1{font-size:21px}
    .bar{padding:0 14px}
    .bar-r #clock{display:none}
  }
</style>
</head>
<body>
<div class="shell">
  <header class="bar">
    <div class="bar-l">
      <b>VPNCHECK</b><span class="slash">/</span><span>ops console</span>
    </div>
    <div class="bar-r">
      <span class="tpl" aria-label="สลับแม่แบบ">
        <a class="on" href="index.html" aria-current="page">console</a>
        <a href="template-registry.html">registry</a>
        <a href="template-poster.html">poster</a>
      </span>
      <span class="link"><i></i>link ok</span>
      <span id="clock">--:--</span>
    </div>
  </header>

  <div class="workspace">
    <aside class="pane-list">
      <div class="search-wrap">
        <form class="search" id="searchForm" role="search" autocomplete="off">
          <svg viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/><path d="M20 20l-3.4-3.4" stroke="currentColor" stroke-width="2"/></svg>
          <label class="sr-only" for="searchKey" style="position:absolute;left:-9999px">ค้นหารหัสพนักงานหรือชื่อ</label>
          <input id="searchKey" type="search" placeholder="ค้น: รหัส / ชื่อ…" aria-label="ค้นหารหัสพนักงานหรือชื่อ">
          <button type="submit">enter</button>
        </form>
      </div>
      <div class="list-meta">
        <span id="statusBox" role="status" aria-live="polite">ready</span>
        <span id="countBox">0</span>
      </div>
      <div class="rows" id="resultBox"></div>
      <div class="list-foot" id="loadMoreWrap"></div>
    </aside>

    <section class="pane-detail" id="detailBox" aria-live="polite"></section>
  </div>
</div>

<div id="toast" role="status" aria-live="polite"></div>

<script src="assets/avatar.js"></script>
<script>
(function () {
  'use strict';

  var SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxMqht7LawyLd6pesWRdGFnMwP6eYXfSeklj2wtDkFTqLZxzzdkxg-iNomzR3LXonEKUg/exec';
  var PAGE = 10;
  var MONTHS = ['ม.ค.', 'ก.พ.', 'มี.ค.', 'เม.ย.', 'พ.ค.', 'มิ.ย.', 'ก.ค.', 'ส.ค.', 'ก.ย.', 'ต.ค.', 'พ.ย.', 'ธ.ค.'];
  var COPYICON = '<svg viewBox="0 0 24 24" fill="none" style="width:13px;height:13px"><rect x="8" y="8" width="11" height="12" rx="2" stroke="currentColor" stroke-width="1.7"/><path d="M5 16V6a2 2 0 012-2h8" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>';
  var EYE = '<svg viewBox="0 0 24 24" fill="none"><path d="M2.6 12S6 6.2 12 6.2 21.4 12 21.4 12 18 17.8 12 17.8 2.6 12 2.6 12z" stroke="currentColor" stroke-width="1.7"/><circle cx="12" cy="12" r="2.5" stroke="currentColor" stroke-width="1.7"/></svg>';
  var EYE_OFF = '<svg viewBox="0 0 24 24" fill="none"><path d="M4 4l16 16M9.6 6.1A9.5 9.5 0 0112 5.9c6 0 9.4 5.8 9.4 5.8a16 16 0 01-2.7 3.3M6.2 7.5A16 16 0 002.6 11.7s3.4 5.8 9.4 5.8c1 0 2-.2 2.9-.5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>';

  var $ = function (id) { return document.getElementById(id); };
  var dom = {
    form: $('searchForm'), input: $('searchKey'), status: $('statusBox'), count: $('countBox'),
    rows: $('resultBox'), more: $('loadMoreWrap'), detail: $('detailBox'), toast: $('toast'), clock: $('clock')
  };

  var state = { all: [], shown: PAGE, selected: -1, keyword: '', requestId: 0 };
  var revealed = {};

  function art(seed) { return typeof avatarSvg === 'function' ? avatarSvg(seed) : ''; }

  function tplLinks(keyword) {
    var links = document.querySelectorAll('.tpl a');
    for (var i = 0; i < links.length; i++) {
      var href = links[i].getAttribute('data-href') || links[i].getAttribute('href');
      links[i].setAttribute('data-href', href);
      links[i].setAttribute('href', href + (keyword ? '?keyword=' + encodeURIComponent(keyword) : ''));
    }
  }

  function esc(v) {
    return String(v === null || v === undefined ? '' : v)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  function pick(o, keys, fb) {
    for (var i = 0; i < keys.length; i++) {
      var v = o[keys[i]];
      if (v !== undefined && v !== null && String(v).trim() !== '') return String(v).trim();
    }
    return fb === undefined ? '' : fb;
  }
  function parseDate(str) {
    if (!str) return null;
    var s = String(str).trim(), m;
    m = s.match(/^(\d{4})[-\/](\d{1,2})[-\/](\d{1,2})/);
    if (m) return new Date(+m[1], +m[2] - 1, +m[3]);
    m = s.match(/^(\d{1,2})[-\/](\d{1,2})[-\/](\d{4})/);
    if (m) { var y = +m[3]; if (y > 2400) y -= 543; return new Date(y, +m[2] - 1, +m[1]); }
    var d = new Date(s);
    return isNaN(d.getTime()) ? null : d;
  }
  function daysLeft(str) {
    var d = parseDate(str);
    if (!d) return null;
    var t = new Date(); t.setHours(0, 0, 0, 0);
    var x = new Date(d.getTime()); x.setHours(0, 0, 0, 0);
    return Math.round((x - t) / 86400000);
  }
  function toneOf(str) {
    var n = daysLeft(str);
    if (n === null) return 'unknown';
    if (n < 0) return 'expired';
    if (n <= 30) return 'warn';
    return 'ok';
  }
  function dateLabel(str) {
    var d = parseDate(str);
    if (!d) return '—';
    return d.getDate() + ' ' + MONTHS[d.getMonth()] + ' ' + (d.getFullYear() + 543);
  }
  function toneWord(t) {
    return t === 'expired' ? 'expired' : t === 'warn' ? 'expiring soon' : t === 'ok' ? 'active' : 'no expiry';
  }
  function daysWord(n) {
    if (n === null) return 'ไม่มีข้อมูลวันหมดอายุ';
    if (n < 0) return 'หมดอายุแล้ว ' + Math.abs(n) + ' วัน';
    if (n === 0) return 'หมดอายุวันนี้';
    return 'เหลือ ' + n + ' วัน';
  }

  function fields(info) {
    return {
      id: pick(info, ['id', 'empId'], ''),
      name: pick(info, ['name', 'firstName'], ''),
      surname: pick(info, ['surname', 'lastName'], ''),
      dept: pick(info, ['dept', 'department'], ''),
      phone: pick(info, ['phone', 'tel'], ''),
      user: pick(info, ['user', 'username'], ''),
      pass: pick(info, ['pass', 'password'], ''),
      expire: pick(info, ['expire', 'expired', 'expiry'], ''),
      xlite: pick(info, ['xlite', 'xLite', 'voip'], ''),
      server: pick(info, ['server', 'svr'], '')
    };
  }

  var toastTimer = null;
  function toast(msg) {
    dom.toast.textContent = msg;
    dom.toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { dom.toast.classList.remove('show'); }, 2500);
  }

  function copy(text, label) {
    var value = String(text === null || text === undefined ? '' : text);
    if (!value || value === '—') return;
    var done = function () { toast('copied · ' + (label || '') ); };
    var legacy = function () {
      var ta = document.createElement('textarea');
      ta.value = value; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      var ok = false;
      try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
      document.body.removeChild(ta);
      ok ? done() : toast('copy failed');
    };
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(value).then(done).catch(legacy);
    } else { legacy(); }
  }

  function rowsHtml() {
    var visible = state.all.slice(0, state.shown);
    return visible.map(function (info, i) {
      var f = fields(info);
      var tone = toneOf(f.expire);
      var n = daysLeft(f.expire);
      var full = (f.name + ' ' + f.surname).trim() || f.user || '—';
      return '<button type="button" class="row" data-pick="' + i + '" data-tone="' + tone + '"' +
        (state.selected === i ? ' aria-current="true"' : '') + '>' +
        '<span class="av">' + art(f.id || full) + '<i class="led"></i></span>' +
        '<span class="row-main"><b>' + esc(full) + '</b><em>' + esc(f.id || '—') + ' · ' + esc(f.dept || '—') + '</em></span>' +
        '<span class="row-days">' + (n === null ? '—' : (n < 0 ? n : n + 'd')) + '</span>' +
      '</button>';
    }).join('');
  }

  function detailHtml() {
    var info = state.all[state.selected];
    if (!info) {
      return '<div class="empty"><b>เลือกรายการจากด้านซ้าย</b>' +
        '<span>พิมพ์รหัสพนักงานหรือชื่อ แล้วกด Enter — จากนั้นคลิกรายการเพื่อดูข้อมูลเต็ม</span></div>';
    }
    var f = fields(info);
    var tone = toneOf(f.expire);
    var n = daysLeft(f.expire);
    var full = (f.name + ' ' + f.surname).trim() || f.user || '—';
    var pct = n === null ? 0 : Math.max(0, Math.min(100, Math.round((n / 365) * 100)));

    return '<div class="d-head">' +
        '<div class="d-who">' +
        '<span class="av av-lg">' + art(f.id || full) + '</span>' +
        '<div><h1>' + esc(full) + '</h1>' +
        '<p class="meta">' + esc(f.id || '—') + ' &nbsp;·&nbsp; ' + esc(f.dept || '—') + (f.phone ? ' &nbsp;·&nbsp; ' + esc(f.phone) : '') + '</p></div>' +
        '</div>' +
        '<div class="d-state"><span class="chip" data-tone="' + tone + '">' + toneWord(tone) + '</span>' +
        '<small>' + esc(daysWord(n)) + '</small></div>' +
      '</div>' +

      '<div class="blk"><h2>credentials</h2>' +
        '<div class="kv"><span class="k">user</span>' +
          '<button class="v" data-copy="' + esc(f.user) + '" data-label="user">' + esc(f.user || '—') + '</button>' +
          '<button class="iconbtn" data-copy="' + esc(f.user) + '" data-label="user" aria-label="คัดลอก user">' + COPYICON + '</button></div>' +
        '<div class="kv"><span class="k">pass</span>' +
          '<button class="v ' + (revealed[state.selected] ? '' : 'hide') + '" data-copy="' + esc(f.pass) + '" data-label="password" data-secret="' + esc(f.pass) + '">' +
            esc(revealed[state.selected] ? (f.pass || '—') : '••••••••') + '</button>' +
          '<button class="iconbtn" data-reveal="1" aria-label="แสดง / ซ่อนรหัสผ่าน">' + (revealed[state.selected] ? EYE_OFF : EYE) + '</button></div>' +
        '<div class="kv"><span class="k">phone</span>' +
          '<button class="v small" data-copy="' + esc(f.phone) + '" data-label="phone">' + esc(f.phone || '—') + '</button>' +
          '<span></span></div>' +
      '</div>' +

      '<div class="blk"><h2>expiry</h2>' +
        '<div class="expiry"><span class="big" data-tone="' + tone + '">' + esc(dateLabel(f.expire)) + '</span></div>' +
        '<div class="bar-track"><div class="bar-fill" data-tone="' + tone + '" style="width:' + (tone === 'expired' ? 100 : pct) + '%"></div></div>' +
        '<p class="bar-note">' + esc(daysWord(n)) + '</p>' +
      '</div>' +

      '<div class="blk"><h2>voip</h2>' +
        '<div class="kv"><span class="k">x-lite</span>' +
          '<button class="v" data-copy="' + esc(f.xlite) + '" data-label="x-lite">' + esc(f.xlite || '—') + '</button><span></span></div>' +
        '<div class="kv"><span class="k">server</span>' +
          '<button class="v" data-copy="' + esc(f.server) + '" data-label="server">' + esc(f.server || '—') + '</button><span></span></div>' +
      '</div>' +

      '<div class="actions">' +
        '<button class="btn-solid" data-copy-all="1">คัดลอกข้อมูลทั้งหมด</button>' +
        '<button class="btn-ghost" data-copy="' + esc(f.pass) + '" data-label="password">คัดลอกรหัสผ่าน</button>' +
      '</div>';
  }

  function render() {
    dom.rows.innerHTML = rowsHtml();
    var visible = Math.min(state.shown, state.all.length);
    dom.count.textContent = String(state.all.length);
    dom.more.innerHTML = state.shown < state.all.length
      ? '<button class="btn-line" id="loadMoreBtn">load more · ' + (state.all.length - state.shown) + ' remaining</button>'
      : '';
    dom.more.classList.toggle('show', state.shown < state.all.length);
    dom.detail.innerHTML = detailHtml();
    if (state.all.length) {
      dom.status.textContent = 'found ' + state.all.length;
      dom.status.setAttribute('data-tone', 'ok');
    }
    void visible;
  }

  function copyAll() {
    var info = state.all[state.selected];
    if (!info) return;
    var f = fields(info);
    var text = [
      'รหัสพนักงาน: ' + (f.id || '—'),
      'ชื่อ-นามสกุล: ' + ((f.name + ' ' + f.surname).trim() || '—'),
      'แผนก: ' + (f.dept || '—'),
      'เบอร์โทร: ' + (f.phone || '—'),
      'User: ' + (f.user || '—'),
      'Password: ' + (f.pass || '—'),
      'หมดอายุ: ' + dateLabel(f.expire),
      'X-Lite: ' + (f.xlite || '—'),
      'Server: ' + (f.server || '—')
    ].join('\n');
    copy(text, 'record');
  }

  function runSearch() {
    var kw = dom.input.value.trim();
    if (!kw) { dom.status.textContent = 'keyword required'; dom.status.setAttribute('data-tone', 'warn'); dom.input.focus(); return; }

    var rid = ++state.requestId;
    state.keyword = kw;
    tplLinks(kw);
    state.all = [];
    state.selected = -1;
    state.shown = PAGE;
    revealed = {};
    dom.status.textContent = 'searching…';
    dom.status.removeAttribute('data-tone');
    dom.count.textContent = '0';
    dom.rows.innerHTML = '<div class="sk-row"><div class="sk" style="width:70%"></div><div class="sk" style="width:45%"></div></div>'.repeat(4);
    dom.detail.innerHTML = detailHtml();

    fetch(SCRIPT_URL + '?action=search&keyword=' + encodeURIComponent(kw), { cache: 'no-store' })
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function (data) {
        if (rid !== state.requestId) return;
        var list = data && data.results ? data.results : [];
        if (!Array.isArray(list)) list = [];
        state.all = list;
        if (!list.length) {
          dom.rows.innerHTML = '';
          dom.more.innerHTML = '';
          dom.more.classList.remove('show');
          dom.status.textContent = 'no match';
          dom.status.setAttribute('data-tone', 'warn');
          dom.detail.innerHTML = '<div class="empty"><b>ไม่พบบันทึกที่ตรงกับ “' + esc(kw) + '”</b>' +
            '<span>ลองสะกดรหัสพนักงานหรือชื่อให้สั้นลง</span></div>';
          return;
        }
        state.selected = 0;
        render();
      })
      .catch(function (err) {
        if (rid !== state.requestId) return;
        dom.status.textContent = 'link error';
        dom.status.setAttribute('data-tone', 'error');
        dom.rows.innerHTML = '';
        dom.detail.innerHTML = '<div class="empty"><b>เชื่อมต่อฐานข้อมูลไม่สำเร็จ</b>' +
          '<span>' + esc(err && err.message ? err.message : String(err)) + '</span>' +
          '<span><button class="btn-ghost" id="retryBtn" style="margin-top:10px">ลองอีกครั้ง</button></span></div>';
      });
  }

  dom.form.addEventListener('submit', function (e) { e.preventDefault(); runSearch(); });

  dom.rows.addEventListener('click', function (e) {
    var row = e.target.closest('[data-pick]');
    if (!row) return;
    state.selected = parseInt(row.getAttribute('data-pick'), 10);
    render();
    if (window.matchMedia('(max-width: 860px)').matches) {
      dom.detail.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }
  });

  dom.more.addEventListener('click', function (e) {
    if (!e.target.closest('#loadMoreBtn')) return;
    state.shown += PAGE;
    render();
  });

  dom.detail.addEventListener('click', function (e) {
    var rev = e.target.closest('[data-reveal]');
    if (rev) {
      revealed[state.selected] = !revealed[state.selected];
      dom.detail.innerHTML = detailHtml();
      return;
    }
    if (e.target.closest('[data-copy-all]')) { copyAll(); return; }
    if (e.target.closest('#retryBtn')) { runSearch(); return; }
    var hit = e.target.closest('[data-copy]');
    if (hit) { copy(hit.getAttribute('data-copy'), hit.getAttribute('data-label')); return; }
  });

  document.addEventListener('keydown', function (e) {
    if (e.key !== '/' || e.ctrlKey || e.metaKey || e.altKey) return;
    var t = (e.target.tagName || '').toLowerCase();
    if (t === 'input' || t === 'textarea') return;
    e.preventDefault();
    dom.input.focus();
  });

  function tick() {
    var d = new Date();
    var p = function (v) { return (v < 10 ? '0' : '') + v; };
    dom.clock.textContent = p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds());
  }
  tick();
  setInterval(tick, 1000);

  var startKeyword = (new URLSearchParams(location.search).get('keyword') || '').trim();
  if (startKeyword) {
    dom.input.value = startKeyword;
    tplLinks(startKeyword);
    runSearch();
  } else {
    dom.detail.innerHTML = detailHtml();
    dom.input.focus();
  }
})();
</script>
</body>
</html>
